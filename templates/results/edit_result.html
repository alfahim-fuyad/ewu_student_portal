{% extends 'results/add_result.html' %}
{% block title %}Edit Result{% endblock %}
{% block content %}
<div class="page-wrap narrow">
    <header class="page-head"><h1>Edit Result</h1></header>
    <form method="post" class="card">
        {% csrf_token %}
        {% for field in form %}
            <div class="field">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="error">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'results:list' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
