{% extends 'base.html' %}
{% load static %}

{% block title %}Delete notice?{% endblock %}

{% block content %}
<div class="page-wrap narrow">
    <header class="page-head"><h1>Delete notice?</h1></header>
    <form method="post" class="card danger-card">
        {% csrf_token %}
        <p>Are you sure you want to delete <strong>{{ object.title }}</strong>?</p>
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'notices:list' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
